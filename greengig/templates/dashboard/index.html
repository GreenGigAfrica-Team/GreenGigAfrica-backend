{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — GreenGig Africa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a href="/" class="sidebar__logo">
      <span>🌿</span> GreenGig <span class="accent">Africa</span>
    </a>
    <nav class="sidebar__nav">
      <a href="/dashboard/" class="nav-item nav-item--active">🏠 Dashboard</a>
      <a href="/dashboard/tasks/" class="nav-item">🔍 Find tasks</a>
      <a href="/dashboard/my-tasks/" class="nav-item">📋 My tasks</a>
      <a href="/dashboard/impact/" class="nav-item">🌿 My impact</a>
    </nav>
    <button class="sidebar__logout" id="logout-btn">← Log out</button>
  </aside>

  <!-- Main -->
  <div class="main-wrap">

    <!-- Top bar -->
    <header class="topbar">
      <button class="topbar__menu" id="menu-btn" aria-label="Open menu">☰</button>
      <div class="topbar__user" id="topbar-user">Loading…</div>
    </header>

    <main class="main-content" id="main-content">

      <!-- Welcome -->
      <section class="welcome-banner" id="welcome-banner">
        <div>
          <h1 id="welcome-name">Welcome back 👋</h1>
          <p>Here's what's available near you today.</p>
        </div>
        <div class="welcome-stats" id="welcome-stats"></div>
      </section>

      <!-- AI Matched Tasks -->
      <section class="section-block">
        <div class="section-block__header">
          <h2>🤖 Recommended for you</h2>
          <a href="/dashboard/tasks/" class="see-all">See all tasks →</a>
        </div>
        <div class="task-feed" id="matched-tasks">
          <div class="loading-state">Finding tasks near you…</div>
        </div>
      </section>

      <!-- My Active Tasks -->
      <section class="section-block">
        <div class="section-block__header">
          <h2>📋 My active tasks</h2>
        </div>
        <div class="task-feed" id="my-tasks">
          <div class="loading-state">Loading your tasks…</div>
        </div>
      </section>

    </main>
  </div>

  <!-- Task detail modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" id="modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    const API = '/api/v1';
    const token = localStorage.getItem('gg_access');
    if (!token) window.location.href = '/login/';

    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

    // ── Load profile ──────────────────────────────────────────
    async function loadProfile() {
      try {
        const res = await fetch(`${API}/auth/me/`, { headers });
        if (res.status === 401) { window.location.href = '/login/'; return; }
        const data = await res.json();
        document.getElementById('welcome-name').textContent = `Welcome back, ${data.full_name} 👋`;
        document.getElementById('topbar-user').textContent = data.full_name;
        document.getElementById('welcome-stats').innerHTML = `
          <div class="stat-pill">✅ ${data.total_tasks_completed} tasks done</div>
          <div class="stat-pill">🌿 ${data.impact_score} impact score</div>
          ${data.total_earnings > 0 ? `<div class="stat-pill">₦${Number(data.total_earnings).toLocaleString()} earned</div>` : ''}
        `;
      } catch(e) { console.error(e); }
    }

    // ── Load matched tasks ────────────────────────────────────
    async function loadMatchedTasks() {
      const container = document.getElementById('matched-tasks');
      try {
        const res = await fetch(`${API}/ai/match/?limit=6`, { headers });
        const data = await res.json();
        if (!data.results || !data.results.length) {
          container.innerHTML = '<div class="empty-state">No tasks in your area yet. Check back soon.</div>';
          return;
        }
        container.innerHTML = data.results.map(taskCard).join('');
        attachTaskHandlers(container);
      } catch(e) {
        container.innerHTML = '<div class="empty-state">Could not load tasks.</div>';
      }
    }

    // ── Load my tasks ─────────────────────────────────────────
    async function loadMyTasks() {
      const container = document.getElementById('my-tasks');
      try {
        const res = await fetch(`${API}/tasks/my-tasks/`, { headers });
        const data = await res.json();
        const active = data.filter(a => ['accepted','submitted'].includes(a.assignment_status));
        if (!active.length) {
          container.innerHTML = '<div class="empty-state">No active tasks. <a href="/dashboard/tasks/">Find one →</a></div>';
          return;
        }
        container.innerHTML = active.map(a => taskCard(a.task, a.assignment_id, a.assignment_status)).join('');
      } catch(e) {
        container.innerHTML = '<div class="empty-state">Could not load tasks.</div>';
      }
    }

    // ── Task card HTML ────────────────────────────────────────
    function taskCard(task, assignmentId = null, assignmentStatus = null) {
      const pay = task.is_volunteer_only ? '<span class="badge badge--vol">Volunteer</span>' : `<span class="badge badge--paid">₦${Number(task.pay_per_worker).toLocaleString()}</span>`;
      const spots = task.spots_remaining > 0 ? `${task.spots_remaining} spots left` : '<span class="full-tag">Full</span>';
      const statusBadge = assignmentStatus ? `<span class="badge badge--status">${assignmentStatus}</span>` : '';
      const actionBtn = assignmentId
        ? `<button class="btn btn--sm btn--outline" onclick="openProofModal(${assignmentId}, '${assignmentStatus}')">View / Submit proof</button>`
        : (task.is_full ? `<button class="btn btn--sm btn--disabled" disabled>Full</button>` : `<button class="btn btn--sm btn--primary" onclick="acceptTask(${task.id}, this)">Accept task</button>`);

      return `
        <article class="task-card" data-id="${task.id}">
          <div class="task-card__header">
            <span class="task-type-badge">${taskTypeIcon(task.task_type)} ${task.task_type.replace(/_/g,' ')}</span>
            ${statusBadge}
          </div>
          <h3 class="task-card__title">${task.title}</h3>
          <p class="task-card__org">by ${task.organisation_name}</p>
          <div class="task-card__meta">
            <span>📍 ${task.location_lga}</span>
            <span>📅 ${formatDate(task.start_datetime)}</span>
            <span>👥 ${spots}</span>
          </div>
          <div class="task-card__footer">
            ${pay}
            ${actionBtn}
          </div>
        </article>`;
    }

    function taskTypeIcon(type) {
      const icons = { waste_collection:'🗑️', tree_planting:'🌳', urban_farming:'🌾', climate_data:'📊', recycling:'♻️', community_education:'📚' };
      return icons[type] || '🌿';
    }

    function formatDate(dt) {
      return new Date(dt).toLocaleDateString('en-NG', { weekday:'short', month:'short', day:'numeric' });
    }

    // ── Accept task ───────────────────────────────────────────
    async function acceptTask(taskId, btn) {
      btn.disabled = true; btn.textContent = 'Accepting…';
      try {
        const res = await fetch(`${API}/tasks/${taskId}/accept/`, { method: 'POST', headers });
        const data = await res.json();
        if (!res.ok) { alert(data.detail || 'Could not accept task.'); btn.disabled = false; btn.textContent = 'Accept task'; return; }
        btn.textContent = '✅ Accepted';
        btn.className = 'btn btn--sm btn--success';
        loadMyTasks();
      } catch { btn.disabled = false; btn.textContent = 'Accept task'; }
    }

    // ── Proof modal ───────────────────────────────────────────
    function openProofModal(assignmentId, status) {
      const overlay = document.getElementById('modal-overlay');
      const body = document.getElementById('modal-body');
      body.innerHTML = `
        <h2 id="modal-title">Submit proof of work</h2>
        <p class="modal-sub">Upload photos at each stage. GPS and timestamp are captured automatically.</p>
        ${['start','during','completion'].map(stage => `
          <div class="proof-stage">
            <label class="proof-label">
              ${stageIcon(stage)} ${stage.charAt(0).toUpperCase() + stage.slice(1)} photo
              <span class="proof-hint">${stageHint(stage)}</span>
            </label>
            <input type="file" accept="image/*" capture="environment" class="proof-upload" data-stage="${stage}" data-assignment="${assignmentId}" />
            <div class="proof-status" id="proof-status-${stage}"></div>
          </div>
        `).join('')}
        <p class="modal-note">📍 Location will be captured automatically when you upload each photo.</p>
      `;
      overlay.hidden = false;

      body.querySelectorAll('.proof-upload').forEach(input => {
        input.addEventListener('change', () => uploadProof(input));
      });
    }

    function stageIcon(s) { return {start:'🟡',during:'🔵',completion:'🟢'}[s]; }
    function stageHint(s) { return {start:'Photo when you arrive at the task site',during:'Photo while doing the work',completion:'Photo showing completed work'}[s]; }

    async function uploadProof(input) {
      const stage = input.dataset.stage;
      const assignmentId = input.dataset.assignment;
      const statusEl = document.getElementById(`proof-status-${stage}`);
      statusEl.textContent = 'Uploading…';

      const formData = new FormData();
      formData.append('stage', stage);
      formData.append('image', input.files[0]);

      // Try to get GPS
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          formData.append('latitude', pos.coords.latitude);
          formData.append('longitude', pos.coords.longitude);
        });
      }

      try {
        const res = await fetch(`${API}/proof/${assignmentId}/upload/`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) { statusEl.textContent = '❌ ' + (data.detail || 'Upload failed'); return; }
        statusEl.textContent = '✅ Uploaded';
        statusEl.style.color = 'var(--green-600)';
      } catch { statusEl.textContent = '❌ Network error'; }
    }

    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('modal-overlay').hidden = true;
    });
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) e.currentTarget.hidden = true;
    });

    function attachTaskHandlers() {} // placeholder

    // ── Logout ────────────────────────────────────────────────
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('gg_access');
      localStorage.removeItem('gg_refresh');
      window.location.href = '/';
    });

    // ── Mobile sidebar ────────────────────────────────────────
    document.getElementById('menu-btn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // ── Init ──────────────────────────────────────────────────
    loadProfile();
    loadMatchedTasks();
    loadMyTasks();
  </script>
</body>
</html>
